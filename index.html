<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>52 Semanas de Hierro</title>
<meta name="description" content="Plan de entrenamiento en casa de 12 meses con dos mancuernas de 8 kg.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#131010">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="52 Semanas">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#131010;
  --surface:#1C1817;
  --surface-2:#262120;
  --surface-3:#312A28;
  --line:#332C2A;
  --line-soft:#241F1E;
  --ink:#F4EEE7;
  --ink-2:#B3A49A;
  --ink-3:#7C6D66;
  --ember:#F2603C;
  --ember-dim:#8E3722;
  --ember-wash:rgba(242,96,60,.13);
  --sage:#79B8A4;
  --sage-wash:rgba(121,184,164,.12);
  --gold:#E8B44A;
  --shell:min(480px,100%);
  --nav-h:66px;
  --pad:18px;
  --r-s:8px;
  --r-m:14px;
  --r-l:20px;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:#0B0908;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{
  width:var(--shell);
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  border-left:1px solid var(--line-soft);
  border-right:1px solid var(--line-soft);
  position:relative;
  overflow-x:hidden;
}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(19,16,16,.93);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:14px var(--pad) 12px;
  display:flex;align-items:center;gap:12px;
}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.brand b{
  font-family:var(--f-display);
  font-variation-settings:"wdth" 118;
  font-weight:800;font-size:15px;letter-spacing:.06em;
  text-transform:uppercase;
}
.brand span{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;
  color:var(--ink-3);text-transform:uppercase;
}
.wkstep{
  display:flex;align-items:center;gap:2px;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:99px;padding:3px;
}
.wkstep button{
  width:26px;height:26px;border-radius:99px;color:var(--ink-2);
  font-size:16px;line-height:1;display:grid;place-items:center;
}
.wkstep button:hover{background:var(--surface-3);color:var(--ink)}
.wkstep .val{
  font-family:var(--f-mono);font-size:11px;font-weight:600;
  padding:0 7px;letter-spacing:.02em;white-space:nowrap;
}
.wkstep .val em{color:var(--ink-3);font-style:normal}

/* ---------- views ---------- */
.view{display:none;padding:20px var(--pad) calc(var(--nav-h) + 34px)}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}*{transition:none!important}}

/* ---------- type ---------- */
.h1{
  font-family:var(--f-display);font-variation-settings:"wdth" 120;
  font-weight:800;font-size:29px;line-height:1.02;letter-spacing:-.01em;
  text-transform:uppercase;text-wrap:balance;margin:0;
}
.h2{
  font-family:var(--f-display);font-variation-settings:"wdth" 115;
  font-weight:700;font-size:17px;letter-spacing:.02em;
  text-transform:uppercase;margin:0;
}
.eyebrow{
  font-family:var(--f-mono);font-size:10.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 9px;
}
.eyebrow.ember{color:var(--ember)}
.lede{color:var(--ink-2);margin:8px 0 0;font-size:14px;max-width:62ch}
.sec{margin-top:30px}
.sec:first-child{margin-top:0}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-m);padding:16px;
}
.stack{display:flex;flex-direction:column;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.tile{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-m);padding:12px 11px;
  display:flex;flex-direction:column;gap:4px;
}
.tile .k{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);
}
.tile .v{
  font-family:var(--f-display);font-variation-settings:"wdth" 115;
  font-weight:800;font-size:22px;line-height:1;
  font-variant-numeric:tabular-nums;
}
.tile .v small{font-size:12px;font-weight:600;color:var(--ink-3)}

/* ---------- hero session card ---------- */
.hero{
  position:relative;overflow:hidden;
  border-radius:var(--r-l);border:1px solid var(--line);
  background:
    radial-gradient(120% 100% at 100% 0%, rgba(242,96,60,.22), transparent 62%),
    linear-gradient(180deg,var(--surface-2),var(--surface));
  padding:18px;
}
.hero.rest{
  background:
    radial-gradient(120% 100% at 100% 0%, rgba(121,184,164,.18), transparent 62%),
    linear-gradient(180deg,var(--surface-2),var(--surface));
}
.hero .tag{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ember);
  background:var(--ember-wash);border:1px solid rgba(242,96,60,.3);
  padding:4px 9px;border-radius:99px;
}
.hero.rest .tag{color:var(--sage);background:var(--sage-wash);border-color:rgba(121,184,164,.3)}
.hero h3{
  font-family:var(--f-display);font-variation-settings:"wdth" 122;
  font-weight:800;font-size:30px;line-height:1;letter-spacing:-.005em;
  text-transform:uppercase;margin:13px 0 6px;text-wrap:balance;
}
.hero p{color:var(--ink-2);margin:0;font-size:13.5px}
.hero .facts{
  display:flex;gap:16px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line);
}
.hero .facts div{display:flex;flex-direction:column;gap:2px}
.hero .facts .k{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);
}
.hero .facts .v{font-family:var(--f-mono);font-size:14px;font-weight:600}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin-top:16px;padding:13px;
  background:var(--ember);color:#1A0B06;
  border-radius:var(--r-s);
  font-family:var(--f-display);font-variation-settings:"wdth" 115;
  font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  transition:filter .15s ease,transform .1s ease;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.99)}
.btn.ghost{
  background:transparent;border:1px solid var(--line);color:var(--ink-2);
}
.btn.ghost:hover{border-color:var(--ink-3);color:var(--ink)}

/* ---------- week strip ---------- */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip button{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:10px 2px 9px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--surface);
  transition:border-color .15s ease,background .15s ease;
}
.strip button:hover{border-color:var(--ink-3)}
.strip button.today{border-color:var(--ember);background:var(--ember-wash)}
.strip .d{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;
  color:var(--ink-2);text-transform:uppercase;
}
.strip .dot{width:7px;height:7px;border-radius:99px;background:var(--surface-3)}
.strip .dot.f{background:var(--ember)}
.strip .dot.c{background:var(--sage)}
.strip .dot.done{box-shadow:0 0 0 3px rgba(232,180,74,.28);background:var(--gold)}

/* ---------- day rows (plan) ---------- */
.day{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-m);padding:13px 14px;
  transition:border-color .15s ease;
}
.day:hover{border-color:var(--ink-3)}
.day .rail{width:3px;align-self:stretch;border-radius:99px;background:var(--surface-3)}
.day.f .rail{background:var(--ember)}
.day.c .rail{background:var(--sage)}
.day .lbl{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);width:26px;flex-shrink:0;
}
.day .mid{flex:1;min-width:0}
.day .mid b{
  display:block;font-family:var(--f-display);font-variation-settings:"wdth" 113;
  font-weight:700;font-size:14.5px;letter-spacing:.02em;text-transform:uppercase;
}
.day .mid span{font-size:12.5px;color:var(--ink-3)}
.day .arw{color:var(--ink-3);font-size:17px;flex-shrink:0}
.day .chk{
  font-family:var(--f-mono);font-size:10px;color:var(--gold);
  letter-spacing:.1em;flex-shrink:0;
}

/* ---------- exercise card ---------- */
.ex{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-m);overflow:hidden;
}
.ex.complete{border-color:rgba(232,180,74,.42)}
.ex > .head{
  display:flex;align-items:flex-start;gap:11px;width:100%;
  text-align:left;padding:14px;
}
.ex .num{
  font-family:var(--f-mono);font-size:11px;font-weight:600;
  color:var(--ember);padding-top:2px;width:18px;flex-shrink:0;
  font-variant-numeric:tabular-nums;
}
.ex.complete .num{color:var(--gold)}
.ex .name{flex:1;min-width:0}
.ex .name b{
  display:block;font-size:15px;font-weight:600;line-height:1.28;
}
.ex .name .pres{
  font-family:var(--f-mono);font-size:12px;color:var(--ember);
  letter-spacing:.02em;margin-top:3px;display:block;
  font-variant-numeric:tabular-nums;
}
.ex .caret{color:var(--ink-3);font-size:12px;padding-top:4px;transition:transform .2s ease}
.ex.open .caret{transform:rotate(180deg)}

.sets{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 13px 43px}
.sets button{
  width:34px;height:32px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--surface-2);
  font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--ink-3);
  transition:all .13s ease;
}
.sets button:hover{border-color:var(--ink-3);color:var(--ink-2)}
.sets button.on{
  background:var(--gold);border-color:var(--gold);color:#241703;
}
.sets .rest{
  width:auto;padding:0 11px;color:var(--sage);
  border-color:rgba(121,184,164,.28);background:var(--sage-wash);
  margin-left:auto;letter-spacing:.02em;
}
.sets .rest:hover{border-color:var(--sage);color:var(--sage)}

.ex .body{display:none;padding:0 14px 15px 43px}
.ex.open .body{display:block}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.meta span{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;
  color:var(--ink-2);background:var(--surface-2);
  border:1px solid var(--line);border-radius:99px;padding:4px 9px;
}
.note{margin:0 0 10px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.note b{color:var(--ink);font-weight:600}
.note.up{
  padding:10px 12px;background:var(--ember-wash);
  border-left:2px solid var(--ember);border-radius:0 var(--r-s) var(--r-s) 0;
  color:var(--ink-2);margin-bottom:0;
}
.note.up b{
  display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ember);margin-bottom:4px;font-weight:500;
}

/* ---------- generic list ---------- */
.rows{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.rows .r{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  background:var(--surface);padding:11px 14px;
}
.rows .r span{color:var(--ink-2);font-size:13.5px}
.rows .r b{
  font-family:var(--f-mono);font-size:12.5px;font-weight:600;
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.rows .r b.em{color:var(--ember)}

/* ---------- ladder ---------- */
.ladder{position:relative;padding-left:26px}
.ladder::before{
  content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;
  background:linear-gradient(180deg,var(--ember-dim),var(--line));
}
.ladder .step{position:relative;padding:6px 0}
.ladder .step::before{
  content:"";position:absolute;left:-23px;top:12px;
  width:9px;height:9px;border-radius:99px;
  background:var(--bg);border:1.5px solid var(--ink-3);
}
.ladder .step.now::before{background:var(--ember);border-color:var(--ember)}
.ladder .step b{font-size:14px;font-weight:600;display:block}
.ladder .step span{font-size:12.5px;color:var(--ink-3)}

/* ---------- phase timeline ---------- */
.phase{
  display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line-soft);
}
.phase:last-child{border-bottom:none}
.phase .idx{
  font-family:var(--f-display);font-variation-settings:"wdth" 122;
  font-weight:800;font-size:26px;line-height:1;color:var(--surface-3);
  font-variant-numeric:tabular-nums;width:40px;flex-shrink:0;
}
.phase.live .idx{color:var(--ember)}
.phase .c b{
  font-family:var(--f-display);font-variation-settings:"wdth" 115;
  font-weight:700;font-size:16px;letter-spacing:.02em;text-transform:uppercase;
  display:block;
}
.phase .c .wk{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;
  color:var(--ink-3);text-transform:uppercase;margin:2px 0 7px;display:block;
}
.phase .c p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.phase .c .split{
  display:inline-block;margin-top:8px;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--ink-2);background:var(--surface-2);
  border:1px solid var(--line);border-radius:99px;padding:3px 9px;
}

/* ---------- chart ---------- */
.chart{width:100%;height:110px;display:block}
.logrow{display:flex;gap:8px;margin-top:12px}
.logrow input{
  flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);
  color:var(--ink);border-radius:var(--r-s);padding:11px 12px;
  font-family:var(--f-mono);font-size:13px;
}
.logrow input::placeholder{color:var(--ink-3)}
.logrow button{
  padding:0 16px;background:var(--surface-3);border:1px solid var(--line);
  border-radius:var(--r-s);font-family:var(--f-mono);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
}
.logrow button:hover{background:var(--ember);color:#1A0B06;border-color:var(--ember)}

/* ---------- disclaimer ---------- */
.warn{
  border:1px solid rgba(232,180,74,.3);background:rgba(232,180,74,.07);
  border-radius:var(--r-m);padding:13px 15px;
}
.warn b{
  display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold);margin-bottom:6px;
}
.warn p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.55}

/* ---------- sync ---------- */
.sync{
  width:32px;height:32px;flex-shrink:0;border-radius:99px;
  border:1px solid var(--line);background:var(--surface-2);
  display:grid;place-items:center;color:var(--ink-3);
  transition:color .2s ease,border-color .2s ease;
}
.sync svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sync[data-s="ok"]{color:var(--sage);border-color:rgba(121,184,164,.35)}
.sync[data-s="saving"]{color:var(--ember);border-color:rgba(242,96,60,.4)}
.sync[data-s="saving"] svg{animation:pulse 1.1s ease-in-out infinite}
.sync[data-s="local"]{color:var(--ink-3)}
.sync[data-s="err"]{color:var(--gold);border-color:rgba(232,180,74,.4)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.sync[data-s="saving"] svg{animation:none}}

.syncrow{
  display:flex;align-items:center;gap:11px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-m);padding:14px;
}
.syncrow .led{width:9px;height:9px;border-radius:99px;background:var(--ink-3);flex-shrink:0}
.syncrow.ok .led{background:var(--sage);box-shadow:0 0 0 4px var(--sage-wash)}
.syncrow.saving .led{background:var(--ember);box-shadow:0 0 0 4px var(--ember-wash)}
.syncrow.err .led{background:var(--gold)}
.syncrow .t{flex:1;min-width:0}
.syncrow .t b{display:block;font-size:14px;font-weight:600}
.syncrow .t span{font-size:12.5px;color:var(--ink-3)}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:var(--shell);z-index:50;
  background:rgba(19,16,16,.95);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:9px 6px calc(9px + env(safe-area-inset-bottom,0px));
}
.nav button{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:4px 0;color:var(--ink-3);
  font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  transition:color .15s ease;
}
.nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ember)}
.nav button:hover{color:var(--ink-2)}

/* ---------- timer sheet ---------- */
.sheet{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(110%);
  width:var(--shell);z-index:60;
  background:var(--surface);border-top:1px solid var(--ember);
  border-radius:var(--r-l) var(--r-l) 0 0;
  padding:20px var(--pad) calc(24px + env(safe-area-inset-bottom,0px));
  transition:transform .28s cubic-bezier(.3,.9,.3,1);
  box-shadow:0 -20px 50px rgba(0,0,0,.5);
}
.sheet.up{transform:translateX(-50%) translateY(0)}
.sheet .lab{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);text-align:center;
}
.sheet .clock{
  font-family:var(--f-display);font-variation-settings:"wdth" 120;
  font-weight:800;font-size:62px;line-height:1;text-align:center;
  font-variant-numeric:tabular-nums;margin:8px 0 4px;color:var(--ember);
}
.sheet .bar{height:3px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:14px 0 16px}
.sheet .bar i{display:block;height:100%;background:var(--ember);transition:width 1s linear}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.foot{
  text-align:center;margin-top:26px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;
  color:var(--ink-3);text-transform:uppercase;
}

/* ---------- instalación y datos ---------- */
.install{
  display:flex;align-items:center;gap:12px;
  border:1px solid rgba(242,96,60,.35);background:var(--ember-wash);
  border-radius:var(--r-m);padding:13px 14px;margin-bottom:20px;
}
.install .t{flex:1;min-width:0}
.install .t b{display:block;font-size:14px;font-weight:600}
.install .t span{font-size:12.5px;color:var(--ink-2)}
.install .go{
  flex-shrink:0;background:var(--ember);color:#1A0B06;border-radius:var(--r-s);
  padding:9px 14px;font-family:var(--f-display);font-variation-settings:"wdth" 112;

/* ==================================================================
   ESTADO
   ================================================================== */
const KEY = "hierro52_v1";
/* segundos desde el epoch Unix: siempre positivo, así el signo del sello
   puede significar hecho / deshecho sin que el reloj del móvil lo estropee */
function ts(){ return Math.max(1, Math.floor(Date.now() / 1000)); }

/* marks[clave] = sello  →  positivo: serie hecha · negativo: serie desmarcada.
   Guardar el sello (y no un simple 1) permite fusionar dos dispositivos que
   han entrenado sin conexión: para cada serie gana la marca más reciente. */
let st = { week:1, marks:{}, peso:[], vista:"hoy", sesionIdx:null, updated:0 };

try{
  const raw = localStorage.getItem(KEY);
  if(raw){
    const o = JSON.parse(raw);
    st = Object.assign(st, o);
    if(o.done && !o.marks){ st.marks = {}; for(const k in o.done) st.marks[k] = 1; }
  }
}catch(e){}
delete st.done;

/* persist: solo escribe en el disco del navegador.
   save: además sella el estado como modificado, que es lo que decide
   quién gana al fusionar dos dispositivos. Navegar no es modificar. */
function persist(){
  prune();
  try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){}
}
function save(){ st.updated = ts(); persist(); }
/* las marcas negativas solo hacen falta hasta que todos los dispositivos
   se han puesto al día; a los 45 días se descartan */
function prune(){
  const corte = ts() - 45 * 86400;
  for(const k in st.marks) if(st.marks[k] < 0 && -st.marks[k] < corte) delete st.marks[k];
}
function isDone(k){ return (st.marks[k] || 0) > 0; }
function setDone(k, v){ st.marks[k] = v ? ts() : -ts(); }

/* fusión: para cada serie gana el sello de mayor magnitud (el más reciente);
   los pesos se unen por fecha; la semana la fija el estado guardado más tarde */
function merge(remoto){
  if(!remoto || typeof remoto !== "object") return false;
  let cambio = false;
  for(const k in (remoto.marks || {})){
    const r = remoto.marks[k], l = st.marks[k] || 0;
    if(Math.abs(r) > Math.abs(l)){ st.marks[k] = r; cambio = true; }
  }
  const porFecha = new Map();
  (remoto.peso || []).concat(st.peso || []).forEach(p => { if(p && p.t) porFecha.set(p.t, p); });
  const unidos = [...porFecha.values()].sort((a, b) => a.t < b.t ? -1 : 1);
  if(unidos.length !== (st.peso || []).length){ st.peso = unidos; cambio = true; }
  if((remoto.updated || 0) > (st.updated || 0) && remoto.week && remoto.week !== st.week){
    st.week = remoto.week; cambio = true;
  }
  return cambio;
}

function faseDe(w){ return FASES.find(f => w >= f.w[0] && w <= f.w[1]) || FASES[3]; }
function hoyIdx(){ const d = new Date().getDay(); return d === 0 ? 6 : d - 1; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function sesionKey(w, di, ei, si){ return "w" + w + "d" + di + "e" + ei + "s" + si; }
function exCompleta(w, di, ses, ei){
  const total = numSeries(ses.ex[ei].p);
  for(let s = 0; s < total; s++) if(!isDone(sesionKey(w, di, ei, s))) return false;
  return true;
}
function numSeries(p){
  const m = String(p).match(/^(\d+)\s*[×x]/);
  if(m) return Math.min(parseInt(m[1], 10), 6);
  const r = String(p).match(/^(\d+)\s*rondas/);
  return r ? parseInt(r[1], 10) : 3;
}
function diaCompleto(w, di){
  const ses = faseDe(w).dias[di];
  if(ses.tipo === "r") return false;
  return ses.ex.every((_, ei) => exCompleta(w, di, ses, ei));
}
function sesionesHechas(){
  let n = 0;
  for(let w = 1; w <= 52; w++) for(let d = 0; d < 7; d++) if(diaCompleto(w, d)) n++;
  return n;
}

function chart(data){
  if(data.length < 2){
    return `<p class="note" style="margin:0;color:var(--ink-3);font-size:13px">Registra tu peso para empezar la gráfica. El punto de partida es 66,5 kg.</p>`;
  }
  const W = 100, H = 100, pad = 6;
  const vals = data.map(d => d.kg);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(max - min < 1){ const m = (max + min) / 2; min = m - .5; max = m + .5; }
  const px = i => pad + (i / (data.length - 1)) * (W - pad * 2);
  const py = v => H - pad - ((v - min) / (max - min)) * (H - pad * 2);
  const pts = data.map((d, i) => px(i).toFixed(2) + "," + py(d.kg).toFixed(2)).join(" ");
  const area = "M" + px(0).toFixed(2) + "," + (H - pad) + " L" + pts.split(" ").join(" L") + " L" + px(data.length - 1).toFixed(2) + "," + (H - pad) + " Z";
  const last = data[data.length - 1];
  return `
  <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolución del peso corporal">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2603C" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#F2603C" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="0" y1="${(pad).toFixed(1)}" x2="${W}" y2="${(pad).toFixed(1)}" stroke="#332C2A" stroke-width=".4"/>
    <line x1="0" y1="${(H/2).toFixed(1)}" x2="${W}" y2="${(H/2).toFixed(1)}" stroke="#332C2A" stroke-width=".4"/>
    <line x1="0" y1="${(H-pad).toFixed(1)}" x2="${W}" y2="${(H-pad).toFixed(1)}" stroke="#332C2A" stroke-width=".4"/>
    <path d="${area}" fill="url(#g)"/>
    <polyline points="${pts}" fill="none" stroke="#F2603C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${px(data.length - 1).toFixed(2)}" cy="${py(last.kg).toFixed(2)}" r="2.4" fill="#F2603C"/>
  </svg>
  <div style="display:flex;justify-content:space-between;margin-top:8px;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums">
    <span>${min.toFixed(1)} kg</span><span style="color:var(--ember)">Ahora ${last.kg.toFixed(1)} kg</span><span>${max.toFixed(1)} kg</span>
  </div>`;
}

/* ==================================================================
   RENDER + EVENTOS
   ================================================================== */
const VIEWS = { hoy:vHoy, plan:vPlan, sesion:vSesion, ejercicios:vEjercicios, comida:vComida, progreso:vProgreso };

function render(){
  const f = faseDe(st.week);
  document.getElementById("wkNum").textContent = st.week;
  document.getElementById("phaseLabel").textContent = "Fase " + f.n + " · " + f.nombre;
  for(const k in VIEWS){
    const el = document.getElementById("v-" + k);
    el.classList.toggle("on", k === st.vista);
    if(k === st.vista) el.innerHTML = VIEWS[k]();
  }
  document.querySelectorAll("#nav button").forEach(b => {
    b.classList.toggle("on", b.dataset.go === st.vista || (st.vista === "sesion" && b.dataset.go === "plan"));
  });
  persist();
}

function go(v){ st.vista = v; render(); window.scrollTo({top:0, behavior:"instant"}); }

document.getElementById("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-go]"); if(b) go(b.dataset.go);
});
document.getElementById("wkUp").addEventListener("click", () => { if(st.week < 52){ st.week++; render(); } });
document.getElementById("wkDown").addEventListener("click", () => { if(st.week > 1){ st.week--; render(); } });

document.querySelector(".app").addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if(open){ st.sesionIdx = parseInt(open.dataset.open, 10); go("sesion"); return; }

  const nav = e.target.closest("[data-go]");
  if(nav){ go(nav.dataset.go); return; }

  const tog = e.target.closest("[data-toggle]");
  if(tog){ tog.closest(".ex").classList.toggle("open"); return; }

  const set = e.target.closest("[data-set]");
  if(set){
    const [ei, si] = set.dataset.set.split(":").map(Number);
    const di = st.sesionIdx ?? hoyIdx();
    const k = sesionKey(st.week, di, ei, si);
    setDone(k, !isDone(k));
    set.classList.toggle("on", isDone(k));
    const ses = faseDe(st.week).dias[di];
    set.closest(".ex").classList.toggle("complete", exCompleta(st.week, di, ses, ei));
    save();
    return;
  }

  const rest = e.target.closest("[data-rest]");
  if(rest){ startTimer(parseInt(rest.dataset.rest, 10)); return; }

  const ins = e.target.closest("[data-i]");
  if(ins){
    if(ins.dataset.i === "si" && inst.evento){
      inst.evento.prompt();
      inst.evento.userChoice.finally(() => { inst.evento = null; render(); });
    }else{
      inst.oculto = true;
      try{ localStorage.setItem("hierro52_inst", "no"); }catch(err){}
      render();
    }
    return;
  }

  const d = e.target.closest("[data-d]");
  if(d){
    const zona = document.getElementById("zonaPegar");
    if(d.dataset.d === "copiar") datos.copiar();
    else if(d.dataset.d === "bajar") datos.descargar();
    else if(d.dataset.d === "subir") document.getElementById("ficheroIn").click();
    else if(d.dataset.d === "pegar"){
      if(!zona.classList.contains("on")){ zona.classList.add("on"); zona.focus(); }
      else if(zona.value.trim()){ datos.aplicar(zona.value.trim()); zona.value = ""; zona.classList.remove("on"); }
      else datos.aviso("Pega el texto en el recuadro y vuelve a tocar.", true);
    }
    return;
  }

  if(e.target.id === "btnPeso"){
    const v = parseFloat(document.getElementById("inPeso").value);
    if(v > 30 && v < 150){
      const hoy = new Date().toISOString().slice(0,10);
      st.peso = st.peso.filter(p => p.t !== hoy);
      st.peso.push({kg:v, t:hoy});
      if(st.peso.length > 80) st.peso.shift();
      render();
    }
    return;
  }
});

/* ---------- cronómetro ---------- */
let tId = null, tLeft = 0, tTotal = 0;
const sheet = document.getElementById("sheet");
const clock = document.getElementById("clock");
const bar = document.getElementById("bar");

function fmt(s){ return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function paint(){
  clock.textContent = fmt(Math.max(tLeft, 0));
  bar.style.width = (Math.max(tLeft, 0) / tTotal * 100) + "%";
}
function startTimer(sec){
  clearInterval(tId);
  tTotal = tLeft = sec; paint();
  sheet.classList.add("up");
  tId = setInterval(() => {
    tLeft--; paint();
    if(tLeft <= 0){
      clearInterval(tId);
      clock.textContent = "¡Vamos!";
      if(navigator.vibrate) navigator.vibrate([120, 70, 120]);
      setTimeout(stopTimer, 2200);
    }
  }, 1000);
}
function stopTimer(){ clearInterval(tId); sheet.classList.remove("up"); }
document.getElementById("tStop").addEventListener("click", stopTimer);
document.getElementById("tPlus").addEventListener("click", () => { tLeft += 15; tTotal = Math.max(tTotal, tLeft); paint(); });

/* ==================================================================
   AVISOS
   ================================================================== */
let toastT = null;
function toast(texto, accion){
  const t = document.getElementById("toast");
  t.innerHTML = esc(texto) + (accion ? ' <button id="toastGo">' + esc(accion.txt) + "</button>" : "");
  t.classList.add("on");
  if(accion) document.getElementById("toastGo").addEventListener("click", accion.fn);
  clearTimeout(toastT);
  if(!accion) toastT = setTimeout(() => t.classList.remove("on"), 3200);
}

/* ==================================================================
   DATOS: exportar e importar
   No hay servidor. Tu historial vive en este dispositivo y lo mueves a
   mano cuando quieras. Al importar se FUSIONA con lo que ya haya: para
   cada serie gana la marca más reciente, así que puedes ir y volver
   entre móvil y ordenador sin perder nada por el camino.
   ================================================================== */
const datos = {
  empaquetar(){
    return JSON.stringify({ app:"52-semanas-de-hierro", v:1, week:st.week,
                            marks:st.marks, peso:st.peso, updated:st.updated });
  },
  nombre(){
    return "52-semanas-" + new Date().toISOString().slice(0,10) + ".json";
  },
  descargar(){
    const b = new Blob([this.empaquetar()], { type:"application/json" });
    const u = URL.createObjectURL(b);
    const a = document.createElement("a");
    a.href = u; a.download = this.nombre();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
    this.aviso("Fichero descargado.");
  },
  async copiar(){
    try{
      await navigator.clipboard.writeText(this.empaquetar());
      this.aviso("Copiado. Pégalo en el otro dispositivo.");
    }catch(e){
      this.aviso("El navegador no dejó copiar; usa «Descargar».", true);
    }
  },
  aplicar(texto){
    let o;
    try{ o = JSON.parse(texto); }
    catch(e){ return this.aviso("Eso no es un fichero de la app.", true); }
    if(!o || typeof o !== "object" || (!o.marks && !o.peso))
      return this.aviso("Ese fichero no tiene datos de entrenamiento.", true);
    const cambio = merge(o);
    save();
    render();
    this.aviso(cambio ? "Datos fusionados." : "Ya estabas al día; nada que añadir.");
  },
  aviso(txt, mal){
    const el = document.getElementById("avisoDatos");
    if(el){ el.textContent = txt; el.classList.toggle("mal", !!mal); }
    else toast(txt);
  }
};

document.getElementById("ficheroIn").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const lector = new FileReader();
  lector.onload = () => datos.aplicar(String(lector.result));
  lector.onerror = () => datos.aviso("No se pudo leer el fichero.", true);
  lector.readAsText(f);
  e.target.value = "";
});

/* ==================================================================
   INSTALACIÓN
   ================================================================== */
const inst = { evento:null, oculto:false };
try{ inst.oculto = localStorage.getItem("hierro52_inst") === "no"; }catch(e){}
inst.instalada = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
inst.ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
inst.disponible = function(){
  return !this.instalada && !this.oculto && (this.evento || this.ios);
};

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  inst.evento = e;
  if(st.vista === "hoy") render();
});
window.addEventListener("appinstalled", () => {
  inst.instalada = true; inst.evento = null;
  toast("Instalada. Ábrela desde tu pantalla de inicio.");
  render();
});

/* ==================================================================
   SERVICE WORKER — es lo que hace que funcione sin internet
   ================================================================== */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener("statechange", () => {
          if(nuevo.state === "installed" && navigator.serviceWorker.controller){
            toast("Hay una versión nueva.", { txt:"Actualizar", fn:() => {
              nuevo.postMessage("saltar");
              location.reload();
            }});
          }
        });
      });
    }).catch(() => {});
  });
}

render();
